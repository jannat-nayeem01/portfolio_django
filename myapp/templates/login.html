{% extends 'base.html' %}

{% block content %}
<div class="col-md-6 col-lg-5 mx-auto mt-4">
<h2 class="text-center text-primary">Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
<p>Not registered? <a href="{% url 'register' %}">Register here</a>.</p>
</div>
{% endblock %}
