{% for edu in education_list %}
  <div class="card shadow-sm mb-3">
    <div class="card-body">

      <dl class="row mb-0">
        <dt class="col-sm-4">Degree</dt>
        <dd class="col-sm-8">{{ edu.degree }}</dd>

        <dt class="col-sm-4">Institution</dt>
        <dd class="col-sm-8">{{ edu.institution }}</dd>

        <dt class="col-sm-4">Passing Year</dt>
        <dd class="col-sm-8">{{ edu.passing_year }}</dd>

        {% if edu.gpa %}
          <dt class="col-sm-4">GPA</dt>
          <dd class="col-sm-8">{{ edu.gpa }}</dd>
        {% endif %}
      </dl>

      {% if show_actions %}
        <div class="text-end mt-2">
          <a href="{% url 'edit_education' edu.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
          <a href="{% url 'delete_education' edu.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </div>
      {% endif %}

    </div>
  </div>
{% empty %}
  <p class="text-muted mb-0">No education added yet.</p>
{% endfor %}
